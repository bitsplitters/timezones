<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Time Zone Picker — bitsplitters</title>
    <meta name="description" content="Find your IANA time zone: click your region on the map, then copy its official name with one click." />
    <link rel="icon" href="/favicon.ico" sizes="any" />
    <link rel="icon" type="image/png" sizes="32x32" href="/favicon-32.png" />
    <link rel="icon" type="image/png" sizes="16x16" href="/favicon-16.png" />
    <link rel="apple-touch-icon" href="/apple-touch-icon.png" />
    <link rel="stylesheet" href="/styles/bootstrap.min.css" />
    <link rel="stylesheet" href="/styles/leaflet.css" />
    <script src="/scripts/leaflet.js"></script>
    <link rel="stylesheet" href="styles/custom.css" />
</head>
<body>
    <div class="tz-wrap">
        <header class="tz-head">
            <a class="mark" href="https://bitsplitters.app">bit<span class="bar"></span>splitters</a>
            <h1>Find and copy your time zone</h1>
            <p class="sub">Click your region on the map to get its official IANA time zone name, then copy it with one click.</p>
        </header>

        <main class="tz-grid">
            <div id="map"></div>

            <aside class="tz-panel">
                <div class="field">
                    <span class="flabel">Auto-detected</span>
                    <span id="auto-detected-time-zone" class="fval">Unknown</span>
                </div>

                <div class="field primary">
                    <span class="flabel">Your time zone</span>
                    <div class="copy-row">
                        <input readonly id="selected-time-zone" class="tz-input" type="text" value="None" />
                        <button id="selected-time-zone-copy-btn" class="tz-copy" type="button">Copy</button>
                    </div>
                    <span class="fhint">Pick your area on the map, then copy.</span>
                </div>

                <div class="field">
                    <span class="flabel">Hovering</span>
                    <span id="hovered-time-zone" class="fval muted">None</span>
                </div>
            </aside>
        </main>

        <footer class="tz-foot">
            <span>A free tool by <a href="https://bitsplitters.app">bitsplitters</a></span>
            <a href="https://tasks.bitsplitters.app">Team Tasks Manager docs</a>
        </footer>
    </div>

    <script src="scripts/map.js"></script>
</body>
</html>
